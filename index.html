<!doctype html>
<!--
  LAN雀卓 の LINE 連携の公開ページ（docs/profile/DESIGN_POINTS_phase4_v1.md X1、04_DESIGN_line_v3.md §4-2・§4-3）。
  ・GitHub Pages の公開リポジトリに、このファイルだけを置く（アプリには入らない）。秘密の値は入っていない。
  ・LINE の中（LIFF）で開き、LINE の本人確認のトークンを取り、同じ Wi-Fi の親 PC の個人画面へ戻す。
  ・2 つの形を受ける（DESIGN_POINTS_phase5_v1.md Y10）：?h&p&k&m（Phase 4、自分のプロフィールに足す）と
    ?h&p&c（Phase 5、招待から入る。c は接続コード。戻りは外のブラウザーへ #lt=トークン&c=コード）。
  ・行き先の検査（line-target の間）は profile/line.js と同じ文。試験（tests/profile-phase4.test.cjs）で同じことを確かめる。
  ・トークンは URL の # の後ろ（fragment）に付けて渡す。このページは何も保存せず、どこにも送らない。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>LAN雀卓 LINE と連携</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 16px; background: #0f2412; color: #e6f2e2; font: 16px/1.7 system-ui, sans-serif; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { margin: 0 0 12px; font-size: 20px; color: #f5d020; }
  p { margin: 0 0 12px; }
  .note { font-size: 14px; color: rgba(200, 230, 200, 0.8); }
  .ng { color: #ffb4a8; }
  button { display: block; width: 100%; min-height: 52px; margin: 8px 0 12px; border: 0; border-radius: 10px;
           background: #06c755; color: #fff; font: 700 17px system-ui, sans-serif; }
  button.quiet { background: rgba(255, 255, 255, 0.12); color: #e6f2e2; font-weight: 400; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">LAN雀卓：LINE と連携</h1>
  <p id="status">読み込んでいます…</p>
  <button id="back" type="button" hidden>LAN雀卓 の画面へ戻る</button>
  <button id="offline" type="button" class="quiet" hidden>LINE なしで入る</button>
  <button id="close" type="button" class="quiet" hidden>閉じる</button>
  <p class="note">このページは、LINE の確認の結果を、同じ Wi-Fi にある LAN雀卓 の PC へ渡すだけです。何も保存しません。</p>
</main>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
'use strict';
// 本番の LIFF アプリ「LAN雀卓 連携」の ID（チャネル 2012445492、2026-11-08 に足した。X2）
var LIFF_ID = '2012445492-pEgRqNbX';

/* line-target:start */
// 行き先の検査（04 v3 §4-3）。公開ページ liff/index.html と同じ文（試験で同じ結果になることを確かめる）。
// ・各部分は 0 か 1〜9 で始まる 3 桁までの数字（先頭の 0 は断る）、255 まで。
// ・私設の範囲（10/8・172.16/12・192.168/16）。
// ・ポートは 1024〜65535（先頭の 0 なし）。
// ・URL を作り、hostname と port がもとの文字列と同じ。移動には、ここで作った URL をそのまま使う。
function lineTarget(host, port) {
  if (typeof host !== 'string' || typeof port !== 'string') return null;
  if (!/^(?:0|[1-9][0-9]{0,2})(?:\.(?:0|[1-9][0-9]{0,2})){3}$/.test(host)) return null;
  var n = host.split('.').map(Number);
  for (var i = 0; i < 4; i++) if (n[i] > 255) return null;
  var isPrivate = n[0] === 10 || (n[0] === 172 && n[1] >= 16 && n[1] <= 31) || (n[0] === 192 && n[1] === 168);
  if (!isPrivate) return null;
  if (!/^[1-9][0-9]{3,4}$/.test(port)) return null;
  var p = Number(port);
  if (p < 1024 || p > 65535) return null;
  var url;
  try { url = new URL('http://' + host + ':' + port + '/client.html'); } catch (e) { return null; }
  if (url.hostname !== host || url.port !== port || url.protocol !== 'http:') return null;
  return url;
}
/* line-target:end */

function byId(id) { return document.getElementById(id); }
function show(text, bad) {
  byId('status').textContent = text;
  byId('status').className = bad ? 'ng' : '';
}
var ready = false; // liff.init が済んだか
function inClient() {
  return ready && typeof liff !== 'undefined' && liff.isInClient && liff.isInClient();
}
function fail(text) {
  show(text, true);
  if (inClient()) {
    byId('close').hidden = false;
    byId('close').onclick = function () { liff.closeWindow(); };
  }
  offline();
}

// 招待（Phase 5）：?h=IP&p=ポート&c=接続コード。手続き ID（k）の代わりに接続コードを持つ。
// Y8：失敗した時は、行き先の検査を通った時だけ「LINE なしで入る」（検査した URL＋ #c=接続コード。外のブラウザーで開く）。
var q = new URLSearchParams(location.search);
var invite = q.has('c') && !q.has('k');
function inviteCode() {
  var c = q.get('c');
  return /^[A-Za-z0-9_-]{8}$/.test(String(c)) ? c : null;
}
function offline() {
  if (!invite) return;
  var target = lineTarget(q.get('h'), q.get('p'));
  var c = inviteCode();
  if (!target || !c) return; // 検査を通らない時は文だけ（どこへも移らない、F04）
  target.search = '?openExternalBrowser=1';
  target.hash = 'c=' + c;
  var url = target.href;
  var btn = byId('offline');
  btn.hidden = false;
  btn.onclick = function () {
    if (inClient()) liff.openWindow({ url: url, external: true });
    else location.href = url;
  };
}
if (invite) {
  document.title = 'LAN雀卓 LINE で参加';
  byId('title').textContent = 'LAN雀卓：LINE で参加';
}
var AGAIN = invite
  ? '招待のリンクをもう一度開くか、下の「LINE なしで入る」で入ってください。'
  : 'LAN雀卓 の個人画面の「設定」から、もう一度始めてください。';

function main() {
  if (!LIFF_ID) return fail('このページはまだ準備中です。');
  if (typeof liff === 'undefined') return fail('LINE の部品を読み込めませんでした。インターネットにつながっているか確かめてください。');
  liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true }).then(function () {
    ready = true;
    var target = lineTarget(q.get('h'), q.get('p'));
    var k = q.get('k');
    var m = q.get('m');
    var c = inviteCode();
    if (invite ? !target || !c : !target || !/^[0-9a-f]{32}$/.test(String(k)) || (m !== 'x' && m !== 'i')) {
      return fail('リンクが正しくありません。' + AGAIN);
    }
    var idToken = liff.getIDToken();
    if (!idToken) return fail('LINE の確認ができませんでした。' + AGAIN);
    if (invite) {
      // 招待：LINE の確認の後は外のブラウザー（Chrome・Safari）へ戻す（Y3）
      target.hash = new URLSearchParams({ lt: idToken, c: c }).toString();
      var to = target.href;
      if (liff.isInClient()) {
        show('LINE の確認が済みました。LAN雀卓 の画面（ブラウザー）へ移ります。移らないときは、下のボタンを押してください。');
        var open = function () { liff.openWindow({ url: to, external: true }); };
        byId('back').hidden = false;
        byId('back').onclick = open;
        open();
      } else {
        show('LINE の確認が済みました。LAN雀卓 の画面へ移ります…');
        location.replace(to);
      }
      return;
    }
    // 検査した URL をそのまま使う（04 §4-3 の 4）
    target.hash = new URLSearchParams({ lt: idToken, k: k }).toString();
    var back = target.href;
    if (liff.isInClient() && m === 'x') {
      // 個人画面は外部のブラウザー（Chrome・Safari）にある：そちらで戻す（D24・X7）
      show('LINE の確認が済みました。LAN雀卓 の画面（ブラウザー）へ戻ります。戻らないときは、下のボタンを押してください。');
      var go = function () { liff.openWindow({ url: back, external: true }); };
      byId('back').hidden = false;
      byId('back').onclick = go;
      go();
    } else {
      // 個人画面が LINE の中にある、またはこのページを外部のブラウザーで開いた：同じ画面のまま戻す
      show('LINE の確認が済みました。LAN雀卓 の画面へ戻ります…');
      location.replace(back);
    }
  }).catch(function () {
    fail('LINE の準備に失敗しました。' + AGAIN);
  });
}
main();
</script>
</body>
</html>
